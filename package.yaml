name:                practical-haskell
version:             0.1.0.0
github:              "githubuser/practical-haskell"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2025 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/practical-haskell#readme>

dependencies:
- aeson
- base >= 4.7 && < 5
- containers
- lens
- hspec
- mtl
- servant
- servant-server
- sqlite-simple
- text
- time
- transformers
- warp

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  practical-haskell-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - practical-haskell

  binary-tree-cache:
    main:                BinaryTreeCache.hs
    source-dirs:         src
    other-modules:       []
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -main-is
    - BinaryTreeCache

  foldables:
    main:                Foldables.hs
    source-dirs:         src
    other-modules:       []
    ghc-options:
    - -threaded
